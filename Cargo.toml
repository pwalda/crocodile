[workspace]
resolver = "2"
members = ["crates/protocol", "crates/server", "crates/client", "crates/mls", "crates/gui"]

[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
blake3 = { version = "1", features = ["serde"] }
thiserror = "2"
anyhow = "1"
hex = "0.4"
rand_core = "0.6"
rand = "0.8"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid", "time", "macros", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
futures-util = "0.3"
openmls = "0.6"
openmls_rust_crypto = "0.3"
openmls_basic_credential = "0.3"
openmls_traits = "0.3"
tls_codec = "0.4"
cpal = "0.15"
opus = "0.3"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
time = { version = "0.3", features = ["serde"] }
sha2 = "0.10"

crocodile-protocol = { path = "crates/protocol" }
crocodile-client = { path = "crates/client" }

[profile.release]
lto = "thin"
codegen-units = 1
