# One-click installers for everyone: no admin rights, no configuration.
appId: chat.crocodile.app
productName: Crocodile
executableName: crocodile
copyright: Copyright © Crocodile contributors
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
extraResources:
  - from: resources
    to: .
asar: true
# Everything is bundled by esbuild/Vite; no node_modules ship with the app.
npmRebuild: false
nodeGypRebuild: false
protocols:
  - name: Crocodile invite
    schemes: [croc]
publish:
  provider: github
  owner: pwalda
  repo: crocodile

mac:
  category: public.app-category.social-networking
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Crocodile uses your microphone for voice chat.
dmg:
  title: Install Crocodile

win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  # Per-user install, no UAC prompt, launches when done: like Discord.
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false

linux:
  syncDesktopName: true
  category: Network;Chat;InstantMessaging
  synopsis: Peer-to-peer, end-to-end encrypted voice and text chat
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64]
  maintainer: Crocodile contributors
  mimeTypes: [x-scheme-handler/croc]
  desktop:
    entry:
      StartupWMClass: Crocodile
