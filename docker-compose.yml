# Self-hosting: a coordination server (and, optionally, your own directory).
#
#   CROC_PUBLIC_URL=https://croc.example.org docker compose up -d coordinator
#
# The coordinator needs TCP 7443 (HTTP/WebSocket), UDP 7443 and 7444 (STUN and
# the relay) and UDP 49160-49259 (relayed traffic). Put TCP 7443 behind a
# TLS-terminating reverse proxy for https/wss, or expose it directly.
services:
  coordinator:
    build:
      context: .
      dockerfile: packages/coordinator/Dockerfile
    image: ghcr.io/pwalda/crocodile-coordinator:latest
    restart: unless-stopped
    # The host's network rather than published ports: the relay uses a UDP
    # port per relayed connection (CROC_RELAY_PORTS, 49160-49259 in the image),
    # and publishing a hundred ports would start a proxy process for each.
    network_mode: host
    environment:
      CROC_NAME: ${CROC_NAME:-My Crocodile coordinator}
      CROC_PUBLIC_URL: ${CROC_PUBLIC_URL:-}
      CROC_REGION: ${CROC_REGION:-}
      CROC_DIRECTORY: ${CROC_DIRECTORY:-}
      CROC_PEERS: ${CROC_PEERS:-}
    volumes:
      - coordinator-data:/data

  directory:
    profiles: [directory]
    build:
      context: .
      dockerfile: apps/directory/Dockerfile
    image: ghcr.io/pwalda/crocodile-directory:latest
    restart: unless-stopped
    ports:
      - '7400:7400'
    volumes:
      - directory-data:/data

volumes:
  coordinator-data:
  directory-data:
