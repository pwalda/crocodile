version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch routine updates; security updates still come individually.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Electron majors change Chromium/WebRTC; upgrade deliberately.
      - dependency-name: electron
        update-types: [version-update:semver-major]
      # Node's types follow the Node version CI and the servers run (22);
      # newer ones would allow APIs that version doesn't have.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  # Actions are pinned to commit SHAs; Dependabot moves the pins and their
  # version comments together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directories: [/packages/coordinator, /apps/directory]
    schedule:
      interval: monthly
    ignore:
      # Move CI and the server images to a new Node major together, on purpose.
      - dependency-name: node
        update-types: [version-update:semver-major]
