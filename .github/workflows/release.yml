name: Release

# Push a tag like v0.2.0 — or publish a release with a new v* tag in the
# GitHub UI — to build installers for every platform, attach them (plus
# auto-update metadata) to the release, and push server images to GHCR.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

# Read-only by default; each job asks only for what it writes.
permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || github.ref_name }}

# Publishing a release in the UI fires both a tag push and a release event;
# the push run skips itself (see prepare), so each tag builds once.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    permissions:
      contents: write # create the draft release
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Published in the UI: its own 'release' run does the work.
            if [ "$EVENT" = push ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          else
            # Plain tag push: create a draft that every platform uploads into.
            notes="docs/releases/${TAG}.md"
            [ -f "$notes" ] || notes=docs/releases/default.md
            gh release create "$TAG" --draft --verify-tag --title "Crocodile ${TAG#v}" --notes-file "$notes"
          fi

  installers:
    name: Installers (${{ matrix.os }})
    needs: prepare
    permissions:
      contents: write # upload installers to the release
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: pnpm install --frozen-lockfile
      - name: Set version from tag
        working-directory: apps/desktop
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"
      - name: Build and publish
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Upload into the release even if it was published a while ago.
          EP_GH_IGNORE_TIME: 'true'
          # Directory services baked into the app (comma-separated URLs).
          CROC_DIRECTORIES: ${{ vars.CROC_DIRECTORIES }}
          # Code signing is optional; without these secrets builds are unsigned.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Missing secrets arrive as empty strings, which electron-builder
          # would take as a certificate path. Unset them instead.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          node scripts/build.mjs
          npx electron-builder --config electron-builder.config.cjs --publish always

  # Make a draft (tag-push) release public once every platform is in; keep
  # whatever title, notes and pre-release choice a UI-published release has.
  publish:
    name: Publish release
    needs: [prepare, installers]
    permissions:
      contents: write # publish the release
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=()
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = true ]; then
            args+=(--draft=false)
          fi
          if [ -z "$(gh release view "$TAG" --json body -q .body | tr -d '[:space:]')" ]; then
            notes="docs/releases/${TAG}.md"
            [ -f "$notes" ] || notes=docs/releases/default.md
            args+=(--notes-file "$notes")
          fi
          if [ ${#args[@]} -gt 0 ]; then gh release edit "$TAG" "${args[@]}"; fi

  images:
    name: Server images
    needs: prepare
    permissions:
      contents: read
      packages: write # push to ghcr.io
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/coordinator/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/crocodile-coordinator:${{ env.TAG }},ghcr.io/${{ github.repository_owner }}/crocodile-coordinator:latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/directory/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/crocodile-directory:${{ env.TAG }},ghcr.io/${{ github.repository_owner }}/crocodile-directory:latest
