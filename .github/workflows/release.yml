name: Release

# Push a tag like v0.2.0 — or publish a release with a new v* tag in the
# GitHub UI — to build installers for every platform, attach them (plus
# auto-update metadata) to the release, and push server images to GHCR.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ github.event.release.tag_name || github.ref_name }}

# Publishing a release in the UI also pushes its tag; build only once.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Make sure a *draft* release exists for the tag, so every platform uploads
  # into the same one (electron-builder only uploads into drafts).
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft=true
          else
            gh release create "$TAG" --draft --verify-tag --title "Crocodile ${TAG#v}" --notes "Building…"
          fi

  installers:
    name: Installers (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: pnpm install --frozen-lockfile
      - name: Set version from tag
        working-directory: apps/desktop
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"
      - name: Build and publish
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Directory services baked into the app (comma-separated URLs).
          CROC_DIRECTORIES: ${{ vars.CROC_DIRECTORIES }}
          # Code signing is optional; without these secrets builds are unsigned.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
        run: node scripts/build.mjs && npx electron-builder --config electron-builder.config.cjs --publish always

  # electron-builder uploads into a draft; publish it once every platform is in.
  publish:
    name: Publish release
    needs: installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Publish with notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="docs/releases/${TAG}.md"
          args=(--draft=false --latest --title "Crocodile ${TAG#v}")
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); fi
          gh release edit "$TAG" "${args[@]}"

  images:
    name: Server images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/coordinator/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/crocodile-coordinator:${{ env.TAG }},ghcr.io/${{ github.repository_owner }}/crocodile-coordinator:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/directory/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/crocodile-directory:${{ env.TAG }},ghcr.io/${{ github.repository_owner }}/crocodile-directory:latest
