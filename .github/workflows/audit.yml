name: Audit

# Known vulnerabilities in the dependencies. Not a required check: an advisory
# published for a package we don't control should not stop every pull request.
# It runs when dependencies change and every week, so a new advisory shows up as
# a failed run.
on:
  pull_request:
    paths: [pnpm-lock.yaml, pnpm-workspace.yaml, '**/package.json', .github/workflows/audit.yml]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Everything, not only `--prod`: the desktop app and the command line tool
      # list the libraries they bundle as devDependencies. High and critical only;
      # lower ones come through Dependabot alerts. One more try, since the
      # registry's audit service now and then fails by itself.
      - run: pnpm audit --audit-level=high || { sleep 30; pnpm audit --audit-level=high; }
