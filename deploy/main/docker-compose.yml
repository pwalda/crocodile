# The main Crocodile server: product page, server directory, install
# scripts and a first coordination server, behind Caddy (automatic HTTPS).
#
#   cd deploy/main
#   cp .env.example .env    # set CROC_DOMAIN and CROC_EMAIL
#   docker compose up -d
#
# DNS: point CROC_DOMAIN and coord.CROC_DOMAIN at this machine.
# Firewall: open TCP 80, 443 and TCP+UDP 7443.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      CROC_DOMAIN: ${CROC_DOMAIN:?set CROC_DOMAIN in .env}
      CROC_EMAIL: ${CROC_EMAIL:?set CROC_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../site:/srv/site:ro
      - ../../scripts:/srv/scripts:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [directory, coordinator]

  directory:
    build:
      context: ../..
      dockerfile: apps/directory/Dockerfile
    image: ghcr.io/pwalda/crocodile-directory:latest
    restart: unless-stopped
    expose: ['7400']
    volumes:
      - directory-data:/data

  coordinator:
    build:
      context: ../..
      dockerfile: packages/coordinator/Dockerfile
    image: ghcr.io/pwalda/crocodile-coordinator:latest
    restart: unless-stopped
    # WebSocket traffic comes through Caddy; STUN, relay (TURN) use UDP directly.
    expose: ['7443']
    ports:
      - '7443:7443/udp'
    environment:
      CROC_NAME: ${CROC_COORD_NAME:-Crocodile main}
      CROC_PUBLIC_URL: https://coord.${CROC_DOMAIN}
      CROC_DIRECTORY: https://${CROC_DOMAIN}
      CROC_REGION: ${CROC_REGION:-}
      CROC_RELAY: ${CROC_RELAY:-on}
      CROC_RELAY_MAX_USERS: ${CROC_RELAY_MAX_USERS:-25}
      CROC_RELAY_IP: ${CROC_RELAY_IP:-}
      CROC_MAILBOX: ${CROC_MAILBOX:-on}
      CROC_MAILBOX_DAYS: ${CROC_MAILBOX_DAYS:-3}
    volumes:
      - coordinator-data:/data
    depends_on: [directory]

volumes:
  caddy-data:
  caddy-config:
  directory-data:
  coordinator-data:
