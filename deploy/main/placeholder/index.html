<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Crocodile Chat: work in progress</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f7f4;
        --text: #1d2a22;
        --muted: #5b6b61;
        --accent: #2f8f5b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111814;
          --text: #e6eee8;
          --muted: #9aaba0;
          --accent: #4fbf82;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 32rem;
        padding: 2rem 1.25rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2rem;
      }
      .badge {
        display: inline-block;
        margin-bottom: 1rem;
        padding: 0.2rem 0.75rem;
        border-radius: 999px;
        border: 1px solid var(--accent);
        color: var(--accent);
        font-size: 0.85rem;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Work in progress</span>
      <h1>Crocodile Chat™</h1>
      <p>Peer-to-peer, end-to-end encrypted voice and text chat. Coming soon.</p>
    </main>
  </body>
</html>
